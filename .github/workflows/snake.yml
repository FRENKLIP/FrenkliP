name: Generate Snake Animation

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  
  # Allows manual triggering via the Actions tab
  workflow_dispatch:
  
  # Run on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#58a6ff&color_dots=#161b22,#0d3868,#1f6feb,#388bfd,#58a6ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0d3868,#1f6feb,#388bfd,#58a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push generated SVG to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output 2>/dev/null || git checkout output
          git rm -rf . 2>/dev/null || true
          cp -r dist/* .
          git add .
          git commit -m "Update snake animation [skip ci]" || exit 0
          git push origin output --force
